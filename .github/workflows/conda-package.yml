# Builds the okvis2 conda package (linux-64) on every push to main, and publishes it to
# https://prefix.dev/vslamlab/vslamlab when a version tag (vX.Y) is pushed.
# Publishing uses prefix.dev trusted publishing (OIDC): prefix.dev > Settings > Repository Access > GitHub,
# repository VSLAM-LAB/okvis2, workflow conda-package.yml, read/write on vslamlab/vslamlab. No API key is stored.
#
# Release: bump `version` in pixi.toml, push to main, check it (VSLAM-LAB okvis2-dev),
# then `git tag vX.Y && git push origin vX.Y`.
name: conda-package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # ceres-solver, brisk, DBoW2, opengv

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          version = tomllib.load(open('pixi.toml', 'rb'))['package']['version']
          if tag != version:
              sys.exit(f'tag v{tag} does not match pixi.toml [package] version {version}')
          print(f'version {tag} OK')
          EOF

      # --clean: pixi reuses its build directory otherwise, and stale files end up in the package
      - name: Build into a local channel
        run: pixi publish --clean --to "$PWD/channel"

      # The package must hold the executable only (INSTALL_APPS_ONLY)
      - name: Inspect package
        run: |
          pkg=$(ls channel/linux-64/okvis2-*.conda)
          tmp=$(mktemp -d)
          unzip -q "$pkg" -d "$tmp"
          files=$(tar --zstd -tf "$tmp"/pkg-*.tar.zst)
          echo "$files"
          [ "$files" = "bin/vslamlab_okvis2_mono_vi" ] || { echo "unexpected package contents"; exit 1; }

      # Runs the executable from a fresh environment: checks all its libraries resolve
      - name: Test
        run: pixi exec -c "$PWD/channel" -c https://prefix.dev/conda-forge -s okvis2 -- vslamlab_okvis2_mono_vi --help

      - uses: actions/upload-artifact@v7
        with:
          name: okvis2-packages
          path: channel/linux-64/okvis2-*.conda
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: okvis2-packages
          path: packages

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      # --skip-existing: a re-run after a partial upload never overwrites a published file
      - name: Upload to prefix.dev
        run: pixi exec rattler-build upload prefix --skip-existing --channel vslamlab/vslamlab packages/*.conda
